[package]
name = "stm32-generator"
version = "0.1.0"
edition = "2024"
authors = [
  "aragami3070 <smirnov17612@gmail.com>",
  "NomenConservandum hramov.sanya2018@yandex.ru"
]

[dependencies]
# NOTE: GUI
eframe = "0.35.0"

# NOTE: Каналы для связи GUI с генератором в core
crossbeam-channel = "0.5.15"

# NOTE: Движок шаблонизации и прочее для core
minijinja = { version = "2.21.0", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
include_dir = { version = "0.7.4", features = ["glob"]}
